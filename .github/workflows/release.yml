name: Build & Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-beta'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: write       # the GitHub release
  packages: write       # push to ghcr.io
  id-token: write       # build provenance: signed by GitHub for this workflow run
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VER: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts
        run: shellcheck -S warning build/*.sh build/claude-usage build/sandbox-backup

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # stable: :<version> and :latest; beta: :<version> and :beta
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !endsWith(github.ref_name, '-beta') }}
            type=raw,value=beta,enable=${{ endsWith(github.ref_name, '-beta') }}
          flavor: latest=false

      # plain single-arch image; buildx's own attestations stay off (they turn it
      # into a multi-entry index), provenance comes from the step below instead
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: build
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # anyone can check that an image was built here, from the tagged commit:
      # gh attestation verify oci://ghcr.io/kaedinger/unbox-sandbox:VER --repo kaedinger/unbox-sandbox
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          case "$VER" in
            *-beta) FLAGS="--prerelease --latest=false" ;;
            *)      FLAGS="--latest" ;;
          esac
          printf 'Image: `%s:%s`\n\nDigest: `%s`\n' "$IMAGE" "$VER" "${{ steps.build.outputs.digest }}" > notes.md
          gh release create "$VER" $FLAGS --generate-notes --notes-file notes.md
